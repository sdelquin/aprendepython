# ==============================================================================
# PROJECT
# ==============================================================================

[project]
site_name = "Aprende Python"
site_description = "La guía definitiva en español para aprender Python."
site_author = "sdelquin"
site_url = "https://aprendepython.es"
copyright = """
Copyright &copy; 2026 Sergio Delgado Quintero
"""

repo_url = "https://github.com/sdelquin/aprendepython"
repo_name = "sdelquin/aprendepython"

extra_css = ["assets/css/custom.css"]
extra_javascript = [
    "assets/js/clipboard.js",
    "assets/js/mathjax.js",
    "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js"
]

[project.theme.icon]
repo = "material/github"

